<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Blueprint | HoopPrint</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #050505;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

.practice {
    min-height: 100vh;
    max-width: 520px;
    margin: auto;
    padding: 32px 22px;
    display: flex;
    flex-direction: column;
}

.brand {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 2px;
    opacity: .55;
}

.blueprint-label {
    margin-top: 48px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 2px;
}

.category {
    margin-top: 10px;
    font-size: 14px;
    opacity: .55;
    text-transform: uppercase;
}

h1 {
    margin: 8px 0 8px;
    font-size: clamp(34px, 9vw, 52px);
    line-height: .95;
    letter-spacing: -2px;
}

.description {
    color: #aaa;
    line-height: 1.5;
    max-width: 400px;
}

.progress {
    display: flex;
    gap: 7px;
    margin: 34px 0;
}

.progress span {
    height: 4px;
    flex: 1;
    background: #292929;
}

.progress span.active {
    background: white;
}

.step-label {
    font-size: 11px;
    letter-spacing: 2px;
    font-weight: 800;
    opacity: .45;
}

.step-title {
    font-size: 25px;
    font-weight: 800;
    margin-top: 8px;
}

.player {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 260px;
}

.play-button {
    width: 118px;
    height: 118px;
    border-radius: 50%;
    border: 2px solid white;
    background: white;
    color: black;
    font-size: 32px;
    cursor: pointer;
}

.play-button:active {
    transform: scale(.96);
}

.status {
    text-align: center;
    font-size: 12px;
    letter-spacing: 2px;
    opacity: .45;
    margin-top: -55px;
}

.controls {
    display: grid;
    grid-template-columns: 1fr 1.4fr;
    gap: 10px;
    margin-top: 28px;
}

.control-button {
    border: 1px solid #444;
    background: transparent;
    color: white;
    padding: 18px 12px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1px;
    cursor: pointer;
}

.next-button {
    background: white;
    color: black;
    border-color: white;
}

.control-button:disabled {
    opacity: .25;
}

.footer {
    text-align: center;
    margin-top: 28px;
    font-size: 10px;
    letter-spacing: 2px;
    opacity: .3;
}
</style>
</head>

<body>

<main class="practice">

    <div class="brand">HOOPPRINT</div>

    <div class="blueprint-label">THE BLUEPRINT</div>
    <div class="category">Shooting</div>

    <h1>One-Dribble<br>Pull-Up</h1>

    <div class="description">
        Build a repeatable pull-up with balance, strong legs
        and a consistent follow-through.
    </div>

    <div class="progress" id="progress"></div>

    <div>
        <div class="step-label" id="step-label"></div>
        <div class="step-title" id="step-title"></div>
    </div>

    <div class="player">
        <button
            class="play-button"
            id="play-button"
            aria-label="Play practice"
        >
            ▶
        </button>
    </div>

    <div class="status" id="status">
        READY
    </div>

    <div class="controls">

        <button
            class="control-button"
            id="again-button"
        >
            ↶ AGAIN
        </button>

        <button
            class="control-button next-button"
            id="next-button"
        >
            NEXT →
        </button>

    </div>

    <div class="footer">
        YOUR GAME. YOUR BLUEPRINT.
    </div>

</main>

<audio id="coach-audio" preload="auto"></audio>

<script>

const steps = [
    {
        title: "Welcome",
        audio: "audio/brock_step1.mp3"
    },
    {
        title: "The Drill",
        audio: "audio/brock_step2.mp3"
    },
    {
        title: "Coach Cues",
        sequence: [
            { audio: "audio/cue_hard_dribble.mp3" },
            { wait: 12000 },
            { audio: "audio/cue_balance.mp3" },
            { wait: 15000 },
            { audio: "audio/cue_eyes_up.mp3" },
            { wait: 15000 },
            { audio: "audio/cue_follow_through.mp3" },
            { wait: 20000 },
            { audio: "audio/cue_good_again.mp3" }
        ]
    }
];

let currentStep = 0;

const audio = document.getElementById("coach-audio");
const playButton = document.getElementById("play-button");
const againButton = document.getElementById("again-button");
const nextButton = document.getElementById("next-button");

const stepLabel = document.getElementById("step-label");
const stepTitle = document.getElementById("step-title");
const status = document.getElementById("status");
const progress = document.getElementById("progress");


function buildProgress() {

    progress.innerHTML = "";

    steps.forEach((step, index) => {

        const bar = document.createElement("span");

        if (index <= currentStep) {
            bar.classList.add("active");
        }

        progress.appendChild(bar);
    });
}


function loadStep() {

    const step = steps[currentStep];

    audio.pause();
    audio.currentTime = 0;
    if (step.audio) {
        audio.src = step.audio;
    } else {
        audio.removeAttribute("src");
    }
    stepLabel.textContent =
        `STEP ${currentStep + 1} OF ${steps.length}`;

    stepTitle.textContent = step.title;

    playButton.textContent = "▶";
    status.textContent = "READY";

    nextButton.textContent =
        currentStep === steps.length - 1
            ? "FINISH ✓"
            : "NEXT →";

    buildProgress();
}


let sequenceRunning = false;
let sequenceCancelled = false;

function wait(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

async function playClip(src) {

    return new Promise((resolve, reject) => {

        audio.src = src;
        audio.currentTime = 0;

        audio.onended = () => resolve();

        audio.onerror = () => reject(
            new Error("Audio failed: " + src)
        );

        audio.play().catch(reject);
    });
}


async function playSequence(sequence) {

    sequenceRunning = true;
    sequenceCancelled = false;

    status.textContent = "COACHING";
    playButton.textContent = "Ⅱ";

    try {

        for (const item of sequence) {

            if (sequenceCancelled) break;

            if (item.audio) {

                status.textContent = "COACHING";

                await playClip(item.audio);

            }

            if (item.wait) {

                status.textContent = "YOUR TURN";

                await wait(item.wait);
            }
        }

        if (!sequenceCancelled) {
            status.textContent = "YOUR TURN";
            playButton.textContent = "▶";
        }

    } catch (error) {

        console.error(error);
        status.textContent = "AUDIO ERROR";

    }

    sequenceRunning = false;
}


async function playAudio() {

    const step = steps[currentStep];

    if (step.sequence) {

        if (sequenceRunning) {

            sequenceCancelled = true;
            audio.pause();

            playButton.textContent = "▶";
            status.textContent = "PAUSED";

            return;
        }

        await playSequence(step.sequence);
        return;
    }

    try {

        if (audio.paused) {
            await audio.play();
        } else {
            audio.pause();
        }

    } catch (error) {

        console.error("Audio playback failed:", error);
        status.textContent = "AUDIO ERROR";
    }
}


playButton.addEventListener("click", playAudio);


againButton.addEventListener("click", async () => {

    audio.pause();
    audio.currentTime = 0;

    try {

        await audio.play();

    } catch (error) {

        console.error(error);
    }
});


nextButton.addEventListener("click", () => {

    if (currentStep < steps.length - 1) {

        currentStep++;
        loadStep();

    } else {

        audio.pause();

        stepLabel.textContent = "BLUEPRINT COMPLETE";
        stepTitle.textContent = "Workout Complete";

        status.textContent = "🏅 SHOOTING";

        playButton.textContent = "✓";
        playButton.disabled = true;

        againButton.disabled = true;
        nextButton.disabled = true;
    }
});


audio.addEventListener("play", () => {

    playButton.textContent = "Ⅱ";
    status.textContent = "COACHING";
});


audio.addEventListener("pause", () => {

    if (!audio.ended) {

        playButton.textContent = "▶";
        status.textContent = "PAUSED";
    }
});


audio.addEventListener("ended", () => {

    playButton.textContent = "▶";
    status.textContent = "YOUR TURN";
});


loadStep();

</script>

</body>
</html>
