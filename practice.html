<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Blueprint | HoopPrint</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #050505;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

.practice {
    min-height: 100vh;
    max-width: 520px;
    margin: auto;
    padding: 32px 22px;
    display: flex;
    flex-direction: column;
}

.brand {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 2px;
    opacity: .55;
}

.blueprint-label {
    margin-top: 48px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 2px;
}

.category {
    margin-top: 10px;
    font-size: 14px;
    opacity: .55;
    text-transform: uppercase;
}

h1 {
    margin: 8px 0;
    font-size: clamp(38px, 10vw, 56px);
    line-height: .95;
    letter-spacing: -2px;
}

.description {
    color: #aaa;
    line-height: 1.5;
    max-width: 420px;
}

.challenge {
    margin-top: 30px;
    border-top: 1px solid #333;
    border-bottom: 1px solid #333;
    padding: 18px 0;
}

.challenge-label {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 2px;
    opacity: .45;
}

.challenge-title {
    margin-top: 6px;
    font-size: 20px;
    font-weight: 800;
}

.player {
    flex: 1;
    min-height: 280px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.play-button {
    width: 130px;
    height: 130px;
    border: 0;
    border-radius: 50%;
    background: #fff;
    color: #000;
    font-size: 38px;
    cursor: pointer;
}

.play-button:active {
    transform: scale(.97);
}

.play-button:disabled {
    cursor: default;
}

.status {
    margin-top: 25px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 2px;
}

.substatus {
    margin-top: 10px;
    text-align: center;
    color: #888;
    font-size: 13px;
    line-height: 1.5;
}

.progress-wrap {
    width: 100%;
    margin-top: 28px;
    display: none;
}

.progress-track {
    width: 100%;
    height: 4px;
    background: #242424;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #fff;
    transition: width 1s linear;
}

.timer {
    margin-top: 12px;
    font-size: 12px;
    letter-spacing: 1px;
    opacity: .45;
}

.footer {
    text-align: center;
    margin-top: 25px;
    font-size: 10px;
    letter-spacing: 2px;
    opacity: .3;
}
</style>
</head>

<body>

<main class="practice">

    <div class="brand">HOOPPRINT</div>

    <div class="blueprint-label">
        THE BLUEPRINT
    </div>

    <div class="category">
        Shooting
    </div>

    <h1>
        One-Dribble<br>
        Pull-Up
    </h1>

    <div class="description">
        Build a repeatable pull-up with balance,
        strong legs and a consistent follow-through.
    </div>

    <div class="challenge">

        <div class="challenge-label">
            TODAY'S CHALLENGE
        </div>

        <div class="challenge-title">
            How many can you make in 60 seconds?
        </div>

    </div>

    <div class="player">

        <button
            class="play-button"
            id="start-button"
            aria-label="Start workout"
        >
            ▶
        </button>

        <div class="status" id="status">
            START WORKOUT
        </div>

        <div class="substatus" id="substatus">
            Put your earbuds in.<br>
            Your coach takes it from here.
        </div>

        <div class="progress-wrap" id="progress-wrap">

            <div class="progress-track">
                <div
                    class="progress-bar"
                    id="progress-bar"
                ></div>
            </div>

            <div class="timer" id="timer">
                60 SEC
            </div>

        </div>

    </div>

    <div class="footer">
        YOUR GAME. YOUR BLUEPRINT.
    </div>

</main>

<audio id="coach-audio" preload="auto"></audio>

<script>

const audio =
    document.getElementById("coach-audio");

const startButton =
    document.getElementById("start-button");

const status =
    document.getElementById("status");

const substatus =
    document.getElementById("substatus");

const progressWrap =
    document.getElementById("progress-wrap");

const progressBar =
    document.getElementById("progress-bar");

const timer =
    document.getElementById("timer");


let workoutStarted = false;
let challengeStarted = false;


/*
----------------------------------------
AUDIO
----------------------------------------
*/

function playClip(src) {

    return new Promise((resolve, reject) => {

        audio.src = src;
        audio.currentTime = 0;

        audio.onended = () => resolve();

        audio.onerror = () => {
            reject(
                new Error(
                    "Audio failed: " + src
                )
            );
        };

        audio.play().catch(reject);
    });
}


/*
----------------------------------------
WAIT
----------------------------------------
*/

function wait(ms) {

    return new Promise(resolve => {

        setTimeout(resolve, ms);

    });
}


/*
----------------------------------------
60 SECOND TIMER
----------------------------------------
*/

function startChallengeTimer() {

    challengeStarted = true;

    progressWrap.style.display = "block";

    let secondsRemaining = 60;

    timer.textContent =
        secondsRemaining + " SEC";

    progressBar.style.width = "0%";

    const timerInterval =
        setInterval(() => {

            secondsRemaining--;

            if (secondsRemaining >= 0) {

                timer.textContent =
                    secondsRemaining + " SEC";

                const elapsed =
                    60 - secondsRemaining;

                const percentage =
                    (elapsed / 60) * 100;

                progressBar.style.width =
                    percentage + "%";
            }

            if (secondsRemaining <= 0) {

                clearInterval(timerInterval);

                timer.textContent = "TIME";

                progressBar.style.width =
                    "100%";
            }

        }, 1000);
}


/*
----------------------------------------
WORKOUT
----------------------------------------
*/

async function runWorkout() {

    workoutStarted = true;

    startButton.disabled = true;

    startButton.textContent = "●";

    status.textContent = "COACHING";

    substatus.textContent =
        "Workout in progress";


    try {

        /*
        WELCOME
        */

        await playClip(
            "audio/brock_step1.mp3"
        );


        /*
        SHORT TRANSITION
        */

        status.textContent = "GET READY";

        await wait(3000);


        /*
        DRILL SETUP
        */

        status.textContent = "COACHING";

        await playClip(
            "audio/drill_60_setup.mp3"
        );


        /*
        THE 60 SECOND CHALLENGE
        STARTS NOW
        */

        status.textContent = "WORK";

        substatus.textContent =
            "Count your makes";

        startChallengeTimer();


        /*
        FIRST 20 SECONDS
        */


    await wait(20000);
    
    
    /*
    FOLLOW-THROUGH CUE
    */
    
    status.textContent = "COACHING";
    
    await playClip(
        "audio/cue_follow_through.mp3"
    );
    
    status.textContent = "WORK";
    
    
    /*
    WORK UNTIL 30 SECONDS
    */
    
    await wait(10000);
    
    
    /*
    30 SECOND CUE
    */
    
    status.textContent = "COACHING";
    
    await playClip(
        "audio/drill_60_thirty_seconds.mp3"
    );
    
    status.textContent = "WORK";
    
    
    /*
    WORK UNTIL 50 SECONDS
    */
    
    await wait(20000);
    
    
    /*
    10 SECOND WARNING
    */
    
    status.textContent = "COACHING";
    
    await playClip(
        "audio/drill_60_ten_seconds.mp3"
    );
    
    status.textContent = "FINISH STRONG";
    
    
    /*
    FINAL 10 SECONDS
    */
    
    await wait(10000);

        /*
        FINISH
        */

        status.textContent = "COACHING";

        await playClip(
            "audio/drill_60_finish.mp3"
        );


        /*
        COMPLETE
        */

        status.textContent =
            "✓ BLUEPRINT COMPLETE";

        substatus.textContent =
            "Workout complete";

        startButton.textContent = "✓";

    }

    catch (error) {

        console.error(error);

        status.textContent =
            "AUDIO ERROR";

        substatus.textContent =
            "Please refresh and try again.";

        startButton.textContent = "!";
    }
}


/*
----------------------------------------
START
----------------------------------------
*/

startButton.addEventListener(
    "click",
    () => {

        if (!workoutStarted) {
            runWorkout();
        }

    }
);

</script>

</body>
</html>
